---
# =============================================================
# roles/mongodb/tasks/main.yml
# PURPOSE: Install, configure, and secure MongoDB on the DB server.
# =============================================================

- name: Install prerequisite packages
  apt:
    name:
      - gnupg
      - curl
      - apt-transport-https
      - python3-pymongo
    state: present
    update_cache: yes

- name: Add MongoDB 7.0 repository with GPG key
  deb822_repository:
    name: mongodb-org-7.0
    types: deb
    uris: https://repo.mongodb.org/apt/ubuntu
    suites: jammy/mongodb-org/7.0
    components: multiverse
    architectures: amd64
    signed_by: https://www.mongodb.org/static/pgp/server-7.0.asc
    state: present
  register: mongo_repo

- name: Update apt cache after adding MongoDB repo
  apt:
    update_cache: yes
  when: mongo_repo.changed

- name: Install MongoDB
  apt:
    name: mongodb-org
    state: present

- name: Deploy MongoDB configuration (auth disabled for initial setup)
  template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart mongod

- name: Start and enable MongoDB service
  systemd:
    name: mongod
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for MongoDB to be ready
  wait_for:
    port: 27017
    host: localhost
    timeout: 60

- name: Create MongoDB admin user
  community.mongodb.mongodb_user:
    login_host: localhost
    login_port: 27017
    database: admin
    name: "{{ mongodb_admin_user }}"
    password: "{{ mongodb_admin_password }}"
    roles:
      - db: admin
        role: userAdminAnyDatabase
      - db: admin
        role: readWriteAnyDatabase
    state: present
  ignore_errors: yes

# Use mongosh directly to avoid pymongo version dependency
- name: Create TravelMemory application database user via mongosh
  command: >
    mongosh admin
    --username {{ mongodb_admin_user }}
    --password {{ mongodb_admin_password }}
    --eval "db.getSiblingDB('{{ mongodb_app_database }}').createUser({
      user: '{{ mongodb_app_user }}',
      pwd: '{{ mongodb_app_password }}',
      roles: [{ role: 'readWrite', db: '{{ mongodb_app_database }}' }]
    })"
  register: create_user
  changed_when: "'already exists' not in create_user.stderr"
  failed_when: false

# Enable authentication by adding the security block to mongod.conf
- name: Enable MongoDB authentication
  blockinfile:
    path: /etc/mongod.conf
    block: |
      security:
        authorization: enabled
    marker: "# {mark} ANSIBLE MANAGED - AUTH"
  notify: restart mongod

- name: Flush handlers to restart MongoDB with auth enabled
  meta: flush_handlers

- name: Wait for MongoDB to be ready after restart
  wait_for:
    port: 27017
    host: localhost
    timeout: 60
