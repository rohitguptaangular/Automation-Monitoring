# =============================================================
# aws_hosts.ini
# PURPOSE: Inventory of servers Ansible will configure.
#
# HOW TO USE:
# After running `terraform apply`, copy the output values:
#   - web_server_public_ip  → replace WEB_SERVER_PUBLIC_IP below
#   - db_server_private_ip  → replace DB_SERVER_PRIVATE_IP below
#
# The DB server is in a private subnet, so Ansible reaches it
# by "jumping" through the web server (ProxyJump).
# =============================================================

# ---------------------------------------------------------------
# Web Server Group
# ---------------------------------------------------------------
[webservers]
web ansible_host=32.197.165.1 ansible_user=ubuntu

# ---------------------------------------------------------------
# Database Server Group
# Ansible connects to it via the web server as a jump host.
# ---------------------------------------------------------------
[dbservers]
db ansible_host=10.0.2.143 ansible_user=ubuntu ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ~/.ssh/travelmemory-key.pem -o StrictHostKeyChecking=no -W %h:%p ubuntu@32.197.165.1"'

# ---------------------------------------------------------------
# All servers share these variables
# ---------------------------------------------------------------
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/travelmemory-key.pem
