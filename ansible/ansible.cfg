# =============================================================
# ansible.cfg
# PURPOSE: Global settings for Ansible.
# Ansible looks for this file in the current directory first,
# then ~/.ansible.cfg, then /etc/ansible/ansible.cfg
# =============================================================

[defaults]
# Where to find the list of servers to manage
inventory = inventory/aws_hosts.ini

# Default SSH user for Ubuntu EC2 instances is "ubuntu"
remote_user = ubuntu

# Path to your SSH private key (.pem file downloaded from AWS)
private_key_file = ~/.ssh/your-key-pair-name.pem
# ⚠️  CHANGE THIS to your actual .pem file path!

# Don't check the host's SSH fingerprint on first connect.
# In production you'd set this to True after adding known hosts.
host_key_checking = False

# How many servers to configure in parallel (1 = sequential, safer for debugging)
forks = 5

# Store facts (server info) to speed up subsequent runs
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 86400  # 24 hours

# Make output more readable with YAML format
stdout_callback = yaml

# Show timing info — useful to see which tasks take longest
[callback_enabled]
callback_enabled = timer, profile_tasks

[ssh_connection]
# Use SSH pipelining — speeds up Ansible by reducing SSH connections
pipelining = True

# SSH args — multiplexing keeps the connection open between tasks (faster)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
